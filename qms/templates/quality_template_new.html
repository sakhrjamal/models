{% extends "base.html" %}{% block title %}نموذج جودة جديد{% endblock %}{% block body %}
<div class="crumb"><a href="{{ url_for('quality_home') }}">الجودة</a><span class="sep">›</span><a href="{{ url_for('quality_templates') }}">القوالب</a><span class="sep">›</span><span class="here">جديد</span></div>
<h1>نموذج جودة جديد</h1>
<div class="card"><form class="grid" method="post" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px">
<div><label>الرمز *</label><input name="code" required placeholder="QC-FLD-XYZ" pattern="[A-Za-z0-9_-]+"></div>
<div class="full"><label>العنوان *</label><input name="title" required></div>
<div><label>الإدارة *</label><select name="dept" required>{% for k,v in DEPT_AR.items() %}<option value="{{ k }}">{{ k }} — {{ v }}</option>{% endfor %}</select></div>
<div><label>النوع *</label><select name="kind" required>{% for k,v in KIND_AR.items() %}<option value="{{ k }}">{{ v }}</option>{% endfor %}</select></div>
<div><label>المنطقة *</label><select name="area" required>{% for k,v in AREA_AR.items() %}<option value="{{ k }}">{{ v }}</option>{% endfor %}</select></div>
<div><label>فاصل الاستحقاق (ساعات)</label><input type="number" step="any" min="0.5" name="freq_hours"></div>
<div class="full"><button class="btn">إنشاء ثم إضافة البنود</button></div></form></div>
{% endblock %}
