{% extends "base.html" %}{% block title %}أمر إنتاج جديد{% endblock %}{% block body %}
<h1>أمر إنتاج جديد</h1>
<div class="sub">اختر المنتج واكتب الكمية فقط — النظام يعبّئ الباقي من بيانات المنتج (المقاس، الماكينة، المسار، الاحتياج، الأكواد)</div>
<form method="post" class="card" id="f" autocomplete="off">
<div class="grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px">
  <div class="full" style="grid-column:1/-1">
    <label>المنتج *</label>
    <input type="text" id="q" placeholder="ابحث بالكود أو الوصف… مثال: GS310M" autofocus>
    <input type="hidden" name="item_code" id="item_code" required>
    <div class="results" id="res" style="display:none"></div>
    <div class="itemcard" id="picked" style="display:none;margin-top:8px"><div><b id="p_code"></b> <span id="p_desc"></span></div>
      <a href="#" id="p_clear" class="mini">تغيير المنتج</a></div>
  </div>
  <div><label>الكمية المطلوبة * <span class="mini" id="unit_lbl"></span></label>
    <input type="number" name="qty_required" id="qty" min="1" step="any" required class="qtyinput" style="max-width:none"></div>
  <div><label>تاريخ التسليم <span class="mini">(اختياري)</span></label><input type="date" name="due_date"></div>
  <div><label>الأولوية <span class="mini">(اختياري)</span></label>
    <select name="priority"><option>عادي</option><option>مستعجل</option></select></div>
</div>
<div id="preview" style="display:none;margin-top:18px"></div>
<div class="wizard-actions"><div class="l"><a class="btn back" href="{{ url_for('wo_list') }}">إلغاء</a></div>
<button class="btn big" id="go" disabled>إصدار الأمر</button></div>
</form>
<script>
(function(){
  var q=document.getElementById('q'),res=document.getElementById('res'),ic=document.getElementById('item_code'),
      qty=document.getElementById('qty'),pv=document.getElementById('preview'),go=document.getElementById('go'),
      picked=document.getElementById('picked'),t=null;
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function fmt(n){return (n==null||n==='')?'—':Number(n).toLocaleString('en-US',{maximumFractionDigits:2})}
  function kv(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+(v==null||v===''?'—':v)+'</span></div>'}
  function search(){
    fetch('{{ url_for("api_items_search") }}?q='+encodeURIComponent(q.value)).then(r=>r.json()).then(function(d){
      res.style.display='block';
      res.innerHTML=d.items.length?d.items.map(function(i){return '<a href="#" data-c="'+esc(i.item_code)+'"><b>'+esc(i.item_code)+'</b> — '+esc(i.description)+'<span>'+esc(i.route_name)+' · '+esc(i.sterile||'')+'</span></a>'}).join(''):'<div class="none">لا نتائج</div>';
    });
  }
  q.addEventListener('input',function(){clearTimeout(t);t=setTimeout(search,200)});
  q.addEventListener('focus',function(){if(!ic.value)search()});
  res.addEventListener('click',function(e){var a=e.target.closest('a[data-c]');if(!a)return;e.preventDefault();pick(a.dataset.c)});
  document.getElementById('p_clear').addEventListener('click',function(e){e.preventDefault();ic.value='';picked.style.display='none';q.style.display='';q.value='';pv.style.display='none';go.disabled=true;q.focus();search()});
  function pick(c){ic.value=c;res.style.display='none';q.style.display='none';picked.style.display='flex';document.getElementById('p_code').textContent=c;refresh();qty.focus()}
  qty.addEventListener('input',function(){clearTimeout(t);t=setTimeout(refresh,250)});
  function refresh(){
    if(!ic.value)return;
    fetch('{{ url_for("api_order_preview") }}?item='+encodeURIComponent(ic.value)+'&qty='+encodeURIComponent(qty.value||0)).then(r=>r.json()).then(function(d){
      if(!d.ok){pv.style.display='block';pv.innerHTML='<div class="msg bad">'+esc(d.msg)+'</div>';go.disabled=true;return}
      var c=d.card,h='';
      document.getElementById('p_desc').textContent=c.description||'';
      document.getElementById('unit_lbl').textContent='('+c.unit+')';
      h+='<div class="autofill"><h4>يُعبَّأ تلقائيًا من بيانات المنتج</h4><div class="kv">';
      h+=kv('المقاس / الطبقات',esc(c.size)+' · '+esc(c.ply)+' طبقة')+kv('X-Ray',esc(c.xray))+kv('معقم / غير معقم',esc(c.sterile));
      h+=kv('المسار',esc(c.route_name))+kv('ماكينة الطي',esc(c.machine_name||c.machine))+kv('وحدة الإنتاج',esc(c.unit));
      if(c.req){h+=kv('عرض السب رول',fmt(c.req.sr_width)+' سم')+kv('إنتاجية السب رول',fmt(c.req.yield_per_sr)+' '+esc(c.unit))}
      h+=kv('كود العبوة (Pack)',esc(c.pack_code))+kv('كود البوكس',esc(c.box_code))+kv('كود الكرتون الرئيسي',esc(c.carton_code));
      if(c.pack_config&&c.pack_config.length)h+='<div class="row"><span class="k">تكوين التعبئة</span><span class="v">'+c.pack_config.map(function(p){return esc(p.text)}).join(' · ')+'</span></div>';
      h+=kv('مراحل الأمر',(c.steps||[]).map(esc).join(' ◀ '));
      h+=kv('رقم التشغيلة المتوقع','<b style="direction:ltr;unicode-bidi:embed">'+esc(c.batch_preview||'—')+'</b>');
      h+='</div></div>';
      if(c.req){var r=c.req;
        h+='<div class="card" style="margin-top:12px;border-right:5px solid var(--brand2)"><h4 style="margin:0 0 8px">احتياج الخامة (Material Requirement)</h4>';
        if(r.ok&&r.sr_needed){h+='<div class="stat"><div><b>'+fmt(r.jumbo_needed)+'</b><span>جامبو رول مطلوب</span></div><div><b>'+fmt(r.sr_needed)+'</b><span>سب رول مطلوب</span></div><div><b>'+fmt(r.per_jumbo)+'</b><span>سب رول لكل جامبو</span></div><div><b>'+fmt(r.usable_width)+'</b><span>العرض المفيد (سم)</span></div></div>'
          +'<div class="mini">'+fmt(r.jumbo_width)+' − '+fmt(r.edge_each)+' − '+fmt(r.edge_each)+' = '+fmt(r.usable_width)+' سم · ⌊'+fmt(r.usable_width)+' ÷ '+fmt(r.sr_width)+'⌋ = '+fmt(r.per_jumbo)+' · ⌈'+fmt(Number(qty.value))+' ÷ '+fmt(r.yield_per_sr)+'⌉ = '+fmt(r.sr_needed)+(r.raw_item?' · الخام: '+esc(r.raw_item):'')+'</div>';}
        else if(!r.ok){h+='<div class="badtext">بيانات ناقصة: '+r.missing.map(esc).join('، ')+'</div>'}
        else{h+='<div class="mini">اكتب الكمية لحساب الاحتياج</div>'}
        h+='</div>'}
      if(d.card.equiv&&d.card.equiv.length&&qty.value){h+='<div class="mini" style="margin-top:8px">المكافئ التقريبي: '+d.card.equiv.map(function(e){return fmt(e.qty)+' '+esc(e.unit)}).join(' · ')+'</div>'}
      (c.warn||[]).forEach(function(w){h+='<div class="hint">'+esc(w)+'</div>'});
      pv.innerHTML=h;pv.style.display='block';
      var blocked=c.req&&!c.req.ok;go.disabled=!!blocked||!(Number(qty.value)>0);
    });
  }
})();
</script>
{% endblock %}
