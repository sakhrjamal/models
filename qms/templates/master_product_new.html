{% extends "base.html" %}{% block title %}صنف جديد{% endblock %}{% block body %}
<h1>إضافة صنف نهائي</h1><div class="sub">بعد الحفظ عرّف تكوين التعبئة. المقاسات والأكواد كلها بيانات — لا حصر لها في الكود.</div>
<form method="post" class="card grid">
<div><label>الكود *</label><input name="item_code" required pattern="[A-Za-z0-9._-]+"></div>
<div class="full"><label>الوصف *</label><input name="description" required></div>
<div><label>مسار التصنيع</label><select name="route_code"><option value="">— بلا مسار —</option>{% for r in routes %}<option value="{{ r.code }}">{{ r.name_ar }}</option>{% endfor %}</select></div>
<div><label>الفئة</label><select name="product_category">{% for c in cats %}<option>{{ c }}</option>{% endfor %}</select></div>
<div><label>معقم؟</label><select name="sterile"><option>غير معقم</option><option>معقم</option></select></div>
<div><label>الوحدة الأساسية</label><select name="uom">{% for u in uoms %}<option>{{ u }}</option>{% endfor %}</select></div>
<div><label>المقاس (للشاش) مثال 10x10 cm</label><input name="size"></div><div><label>الطبقات</label><input type="number" name="ply"></div>
<div><label>الخط الكاشف</label><select name="xray"><option value="">—</option><option>WITH X-RAY</option><option>WITHOUT X-RAY</option></select></div>
<div><label>الميش</label><input name="mesh" placeholder="18x11"></div>
<div><label>عرض المنتج (للرباط) مثال 10 cm</label><input name="width_cm"></div><div><label>الطول (م)</label><input name="length_m"></div>
<div><label>ماكينة الطي (للشاش الكامل)</label><select name="machine_code"><option value="">—</option>{% for m in machines %}<option value="{{ m.machine_code }}">{{ m.machine_code }}</option>{% endfor %}</select></div>
<div><label>العائلة</label><input name="family"></div>
<div class="full"><button class="btn">إضافة</button></div></form>{% endblock %}
